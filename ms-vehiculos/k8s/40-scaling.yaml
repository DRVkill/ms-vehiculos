apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: vehiculos
  namespace: vehiculos
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: vehiculos
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
    - type: Resource
      resource:
        name: memory
        target: { type: Utilization, averageUtilization: 85 }
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 2
          periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 180
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: vehiculos
  namespace: vehiculos
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: vehiculos }
