apiVersion: apps/v1
kind: Deployment
metadata:
  name: vehiculos
  namespace: vehiculos
  labels: { app: vehiculos }
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels: { app: vehiculos }
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels: { app: vehiculos }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9004"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      serviceAccountName: vehiculos-sa
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app: vehiculos }
      containers:
        - name: vehiculos
          image: ms-vehiculos:IMAGE_TAG
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9004
          envFrom:
            - configMapRef: { name: vehiculos-config }
          env:
            - name: DB_USERNAME
              valueFrom: { secretKeyRef: { name: vehiculos-db, key: DB_USERNAME } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: vehiculos-db, key: DB_PASSWORD } }
          resources:
            requests: { cpu: 250m, memory: 384Mi }
            limits: { cpu: "1", memory: 768Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 5
            failureThreshold: 3
          lifecycle:
            preStop:
              sleep: { seconds: 5 }
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
