services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: vehiculos
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      retries: 20
    networks: [datos]

  vehiculos:
    build:
      context: .
      args:
        APP_VERSION: compose
    image: ms-vehiculos:local
    environment:
      DB_URL: jdbc:mysql://mysql:3306/vehiculos?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy
    deploy:
      replicas: 3
      resources:
        limits: { cpus: "1.0", memory: 512M }
        reservations: { cpus: "0.25", memory: 256M }
      restart_policy:
        condition: on-failure
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    networks: [datos, frontend]

  lb:
    image: nginx:1.27-alpine
    ports: ["8080:80"]
    volumes:
      - ./scripts/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [vehiculos]
    networks: [frontend]

networks:
  frontend:
  datos:
    internal: true

volumes:
  mysql-data:
